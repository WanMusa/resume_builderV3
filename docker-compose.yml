x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./data:/app/data
    - ./inbox:/app/inbox
    - ./assets:/app/assets:ro
    - ./prompts:/app/prompts:ro
  networks:
    - ai_platform

services:
  api:
    <<: *app
    environment:
      VIRTUAL_HOST: ${APP_DOMAIN:-wanagents.duckdns.org}
      VIRTUAL_PORT: "8000"
      VIRTUAL_PATH: /resume/
      VIRTUAL_DEST: /
      LETSENCRYPT_HOST: ${APP_DOMAIN:-wanagents.duckdns.org}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${RESUME_BUILDER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["resume-builder", "worker"]
    stop_signal: SIGINT
    stop_grace_period: 5m

  importer:
    <<: *app
    command: ["resume-builder", "import-inbox", "--watch"]
    stop_signal: SIGINT
    stop_grace_period: 5m

networks:
  ai_platform:
    external: true
