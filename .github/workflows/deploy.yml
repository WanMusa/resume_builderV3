name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[test]'
      - name: Bootstrap isolated CI application database
        env:
          DATABASE_URL: postgresql+psycopg://resume_builder@postgres:5432/resume_builder
          DATABASE_PASSWORD: ci-app-password
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          python -m app.provision | docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d postgres --set ON_ERROR_STOP=1
      - run: python -m pytest
        env:
          PROVISION_TEST_CONTAINER: ${{ job.services.postgres.id }}
          CORE_TEST_DATABASE_URL: postgresql+psycopg://resume_builder@localhost:5432/resume_builder
          CORE_TEST_DATABASE_PASSWORD: ci-app-password
      - name: Verify schema bootstrap and application database connectivity
        env:
          DATABASE_URL: postgresql+psycopg://resume_builder@localhost:5432/resume_builder
          DATABASE_PASSWORD: ci-app-password
        run: |
          resume-builder init-db
          resume-builder init-db
          python -c 'from app.config import Settings; from app.deployment import check_database; check_database(Settings(), ready=True); print("Application database and schema ready")'
      - name: Validate deployment shell and Compose
        run: |
          bash -n scripts/deploy.sh
          shellcheck scripts/deploy.sh
          touch .env
          docker compose --env-file .env config --quiet
      - name: Check shared-host proxy routing
        run: |
          docker compose --env-file .env config --format json | python -c '
          import json
          import sys

          config = json.load(sys.stdin)
          api = config["services"]["api"]
          environment = api["environment"]
          assert environment["VIRTUAL_HOST"] == "wanagents.duckdns.org"
          assert environment["LETSENCRYPT_HOST"] == environment["VIRTUAL_HOST"]
          assert environment["VIRTUAL_PORT"] == "8000"
          assert environment["VIRTUAL_PATH"] == "/resume/"
          assert environment["VIRTUAL_DEST"] == "/"
          assert "ai_platform" in api["networks"]
          assert api["ports"] and all(port["host_ip"] == "127.0.0.1" for port in api["ports"])
          for name in ("worker", "importer"):
              assert not config["services"][name].get("environment", {}).get("VIRTUAL_HOST")
          print("Shared-host routing contract passed")
          '
      - name: Build production image
        run: docker build --tag resume-builder-ci:${{ github.sha }} .

  deploy:
    needs: ci
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: resume-builder-v3-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy tested revision with pinned host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DEPLOY_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEPLOY_API_TOKEN: ${{ secrets.API_TOKEN }}
          DEPLOY_DB_USER: ${{ secrets.DB_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Set VPS_HOST to a hostname or IPv4 address.'; exit 1; }
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo 'Set a valid VPS_USER.'; exit 1; }
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || { echo 'Set VPS_SSH_KEY and independently verified VPS_KNOWN_HOSTS.'; exit 1; }
          [[ "$DEFAULT_BRANCH" =~ ^[a-zA-Z0-9._/-]+$ ]] || exit 1
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$ssh_dir/known_hosts" >/dev/null || { echo 'VPS_KNOWN_HOSTS must pin VPS_HOST on SSH port 22.'; exit 1; }
          # Secrets travel only in the encrypted SSH input stream, never command arguments.
          python - <<'PY' > "$ssh_dir/deploy-input"
          import os
          import shlex
          from pathlib import Path

          for key in ("DATABASE_PASSWORD", "OPENAI_API_KEY", "API_TOKEN", "DB_USER"):
              name = f"DEPLOY_{key}"
              print(f"export {name}={shlex.quote(os.environ.get(name, ''))}")
          print(Path("scripts/deploy.sh").read_text(), end="")
          PY
          chmod 600 "$ssh_dir/deploy-input"
          timeout 40m ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "timeout 2100 bash -s -- '$DEPLOY_SHA' '$DEFAULT_BRANCH'" < "$ssh_dir/deploy-input"
