[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder-v3"
version = "0.1.0"
description = "JSON inbox driven resume generation with PostgreSQL checkpoints"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.1",
  "starlette==1.8.0",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "pydantic-settings==2.11.0",
  "httpx==0.28.1",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
resume-builder = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
